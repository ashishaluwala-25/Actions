name: test-if-condition
on: 
  push:
    branches:
      - main
      - test
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: run if main branch push
        if: github.ref == 'refs/heads/main'
        run: echo "this is main branch"
      - name: run this step
        run: echo "this is manual"
  job2:
    runs-on: ubuntu-latest
    steps:
      - name: run if test branch push
        if: github.ref == 'refs/heads/test'
        run: echo "this is test branch"
