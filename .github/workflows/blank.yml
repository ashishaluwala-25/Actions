name: test-inputs
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - uat
          - prod
      artifact_tag:
        description: Select GIT tag to deploy
        required: true
jobs:
  test-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: deploy the application
        run: echo "deploying the ${{ inputs.artifact_tag }} into ${{ inputs.environment }}"
